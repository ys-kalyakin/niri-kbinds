name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build bundle and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (locked)
        run: cargo build --release --locked
      - name: Stage bundle
        run: |
          mkdir -p bundle
          cp target/release/kbinds target/release/kbinds-overlay bundle/
          cp README.md bundle/
          strip bundle/kbinds bundle/kbinds-overlay
      - name: Pack tarball
        run: |
          tar czf "niri-kbinds-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" \
            -C bundle kbinds kbinds-overlay README.md
          tar tzf "niri-kbinds-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "niri-kbinds-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
